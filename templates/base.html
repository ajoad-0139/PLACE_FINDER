{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PropertyFinder{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav>
        <section class="nav-left-section">
            <svg
            width="30"
            height="30"
            viewBox="0 0 576 512"
            fill="rgb(43, 71, 51)"
            xmlns="http://www.w3.org/2000/svg"
        >
            <path d="M288-16c17.7 0 32 14.3 32 32l0 18.3c98.1 14 175.7 91.6 189.7 189.7l18.3 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-18.3 0c-14 98.1-91.6 175.7-189.7 189.7l0 18.3c0 17.7-14.3 32-32 32s-32-14.3-32-32l0-18.3C157.9 463.7 80.3 386.1 66.3 288L48 288c-17.7 0-32-14.3-32-32s14.3-32 32-32l18.3 0C80.3 125.9 157.9 48.3 256 34.3L256 16c0-17.7 14.3-32 32-32zM128 256a160 160 0 1 0 320 0 160 160 0 1 0 -320 0zm160-96a96 96 0 1 1 0 192 96 96 0 0 1 0-192z"/>
        </svg>
            <p class="company-banner" style="color: rgb(43, 71, 51);">PropertyFinder</p>
        </section>
        <section class="nav-right-section">
            
            <button class="nav-menu-button" aria-label="toggle menu">
                <svg class="nav-menu-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                    <path
                        d="M96 160C96 142.3 110.3 128 128 128L512 128C529.7 128 544 142.3 544 160C544 177.7 529.7 192 512 192L128 192C110.3 192 96 177.7 96 160zM96 320C96 302.3 110.3 288 128 288L512 288C529.7 288 544 302.3 544 320C544 337.7 529.7 352 512 352L128 352C110.3 352 96 337.7 96 320zM544 480C544 497.7 529.7 512 512 512L128 512C110.3 512 96 497.7 96 480C96 462.3 110.3 448 128 448L512 448C529.7 448 544 462.3 544 480z" />
                </svg>
            </button>
        </section>
    </nav>
    <!-- main section starts here  -->
    <main class="main-layout">
        {% block content %}{% endblock %}
    </main>

    <script>
        document.querySelector('.nav-menu-button').addEventListener('click', function () {
            document.querySelector('.nav-link-container').classList.toggle('nav-link-container-open');
        });
    </script>
    {% block extra_js %}{% endblock %}
     <script src="{% static 'js/index.js' %}"></script>
</body>
</html>
